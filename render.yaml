services:
  - type: web
    name: opsflow-app
    env: docker
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opsflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: "*"

databases:
  - name: opsflow-db
    plan: free
    region: oregon
    databaseName: opsflow
    user: opsflow
